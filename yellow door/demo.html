<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yellow Door Demo</title>
    <style>
      body {
        margin: 0;
        min-height: 200vh;
        font-family: system-ui, sans-serif;
        background: linear-gradient(180deg, #1e293b 0%, #334155 100%);
        color: #f8fafc;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 24px 120px;
      }

      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Yellow Door</h1>
      <p>Scroll anywhere on this page to open the door.</p>
      <p>Click anywhere to open the door and release the bird.</p>
      <p>Keep scrolling to see the effect again after the cooldown.</p>
    </main>

    <script src="./yellow-door.js"></script>
    <script>
      YellowDoor.init({
        assetBase: "./assets/",
        speed: 3
      });
    </script>
  </body>
</html>
